server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  location /api/ {
    proxy_pass http://api:4100;
    proxy_set_header Host $host;
    proxy_set_header X-Request-Id $request_id;
    client_max_body_size 40m;
  }
}
