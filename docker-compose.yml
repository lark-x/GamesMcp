services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: gip
      POSTGRES_PASSWORD: gip
      POSTGRES_DB: gip
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - "${DATA_DIR:?DATA_DIR must point to a persistent external data directory}/postgres:/var/lib/postgresql/data"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gip -d gip"]
      interval: 5s
      timeout: 5s
      retries: 10

  istaroth:
    image: "${ISTAROTH_IMAGE:-ghcr.io/isundaylee/istaroth:latest}"
    environment:
      CHECKPOINT_DIR: /checkpoints
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - "${DATA_DIR:?DATA_DIR must point to a persistent external data directory}/istaroth-checkpoints:/checkpoints"
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    env_file: .env
    environment:
      HOST: 0.0.0.0
      DATABASE_URL: postgres://gip:gip@postgres:5432/gip
      DATA_DIR: /app/data
      GAMESMCP_ISTAROTH_URL: http://istaroth:8000/mcp/
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:4100:4100"
    volumes:
      - "${DATA_DIR:?DATA_DIR must point to a persistent external data directory}:/app/data"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4100/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]

  worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgres://gip:gip@postgres:5432/gip
      DATA_DIR: /app/data
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - "${DATA_DIR:?DATA_DIR must point to a persistent external data directory}:/app/data"
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    depends_on:
      - api
    ports:
      - "127.0.0.1:4173:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1/"]
