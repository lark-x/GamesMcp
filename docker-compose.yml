services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: gip
      POSTGRES_PASSWORD: gip
      POSTGRES_DB: gip
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - "${DATA_DIR:?DATA_DIR must point to a persistent external data directory}/postgres:/var/lib/postgresql/data"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gip -d gip"]
      interval: 5s
      timeout: 5s
      retries: 10

  istaroth:
    image: "${ISTAROTH_IMAGE:?ISTAROTH_IMAGE must be pinned to a tag or digest}"
    environment:
      ISTAROTH_MCP_LANGUAGE: "${ISTAROTH_MCP_LANGUAGE:-CHS}"
      ISTAROTH_DOCUMENT_STORE_SET: "${ISTAROTH_DOCUMENT_STORE_SET:-CHS:/data/checkpoint/chs}"
      ISTAROTH_TRAINING_DEVICE: "${ISTAROTH_TRAINING_DEVICE:-cpu}"
      HF_HOME: /data/models/hf
    command:
      - sh
      - -c
      - >
        fastmcp run scripts/mcp_server.py
        --transport=streamable-http
        --host=0.0.0.0
        --port=8000
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - "${DATA_DIR:?DATA_DIR must point to a persistent external data directory}/istaroth:/data"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c "import json,urllib.request,sys; req=urllib.request.Request(''http://127.0.0.1:8000/mcp'', data=json.dumps({''jsonrpc'':''2.0'',''id'':1,''method'':''initialize'',''params'':{''protocolVersion'':''2024-11-05'',''capabilities'':{},''clientInfo'':{''name'':''gamesmcp-health'',''version'':''0.1.0''}}}).encode(), headers={''content-type'':''application/json'',''accept'':''application/json, text/event-stream''}); urllib.request.urlopen(req, timeout=5).read(); sys.exit(0)"',
        ]
      interval: 15s
      timeout: 10s
      retries: 20

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    env_file: .env
    environment:
      HOST: 0.0.0.0
      DATABASE_URL: postgres://gip:gip@postgres:5432/gip
      DATA_DIR: /app/data
      GAMESMCP_ISTAROTH_URL: http://istaroth:8000/mcp
      GAMESMCP_STARRAIL_DATA_DIR: /app/data/games/starrail/turn-based-game-data
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:4100:4100"
    volumes:
      - "${DATA_DIR:?DATA_DIR must point to a persistent external data directory}:/app/data"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4100/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]

  worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgres://gip:gip@postgres:5432/gip
      DATA_DIR: /app/data
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - "${DATA_DIR:?DATA_DIR must point to a persistent external data directory}:/app/data"
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    depends_on:
      - api
    ports:
      - "127.0.0.1:4173:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1/"]
