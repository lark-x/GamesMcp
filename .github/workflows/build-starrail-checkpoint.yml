name: build-starrail-checkpoint

on:
  workflow_dispatch:
    inputs:
      turn_based_game_data_ref:
        description: "Pinned DimbreathBot/TurnBasedGameData ref"
        required: true
        default: "8cdb905dc2f8e6fffa9be4eb07af3e34435d6091"
      istaroth_ref:
        description: "Pinned lark-x/istaroth ref"
        required: true
        default: "f22ea938704f414cfa6bfe03bc65b71142c781b7"
  schedule:
    - cron: "0 20 * * *"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Log provenance revisions
        run: |
          echo "=== StarRail Checkpoint Build Provenance ==="
          echo "GamesMcp commit: ${{ github.sha }}"
          echo "TurnBasedGameData ref: ${{ inputs.turn_based_game_data_ref || vars.TURN_BASED_GAME_DATA_REF || '8cdb905dc2f8e6fffa9be4eb07af3e34435d6091' }}"
          echo "Istaroth ref: ${{ inputs.istaroth_ref || vars.ISTAROTH_REF || 'f22ea938704f414cfa6bfe03bc65b71142c781b7' }}"
      - name: Checkout GamesMcp
        uses: actions/checkout@v4
        with:
          path: GamesMcp
      - name: Checkout TurnBasedGameData
        uses: actions/checkout@v4
        with:
          repository: DimbreathBot/TurnBasedGameData
          ref: ${{ inputs.turn_based_game_data_ref || vars.TURN_BASED_GAME_DATA_REF || '8cdb905dc2f8e6fffa9be4eb07af3e34435d6091' }}
          path: TurnBasedGameData
      - name: Checkout Istaroth fork
        uses: actions/checkout@v4
        with:
          repository: lark-x/istaroth
          ref: ${{ inputs.istaroth_ref || vars.ISTAROTH_REF || 'f22ea938704f414cfa6bfe03bc65b71142c781b7' }}
          path: istaroth
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
      - name: Install Istaroth dependencies
        run: |
          uv sync
        working-directory: istaroth
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: GamesMcp/pnpm-lock.yaml
      - name: Install GamesMcp dependencies
        run: pnpm install --frozen-lockfile
        working-directory: GamesMcp
      - name: Build StarRail corpus
        run: pnpm data:starrail:corpus --source ../TurnBasedGameData --output ../starrail-corpus
        working-directory: GamesMcp
      - name: Validate StarRail corpus
        run: pnpm data:starrail:validate --corpus ../starrail-corpus
        working-directory: GamesMcp
      - name: Build StarRail checkpoint
        run: pnpm checkpoint:starrail:build
        working-directory: GamesMcp
        env:
          ISTAROTH_DIR: ${{ github.workspace }}/istaroth
          STARRAIL_CORPUS_DIR: ${{ github.workspace }}/starrail-corpus
          STARRAIL_CHECKPOINT_DIR: ${{ github.workspace }}/starrail-checkpoint
          ISTAROTH_EMBEDDING_BACKEND: sentence-transformers
          ISTAROTH_EMBEDDING_MODEL: BAAI/bge-small-zh-v1.5
          ISTAROTH_DEVICE: cpu
      - name: Verify checkpoint integrity and provenance
        run: pnpm checkpoint:starrail:verify --checkpoint ../starrail-checkpoint
        working-directory: GamesMcp
        env:
          TURN_BASED_GAME_DATA_REF: ${{ inputs.turn_based_game_data_ref || vars.TURN_BASED_GAME_DATA_REF || '8cdb905dc2f8e6fffa9be4eb07af3e34435d6091' }}
          ISTAROTH_REF: ${{ inputs.istaroth_ref || vars.ISTAROTH_REF || 'f22ea938704f414cfa6bfe03bc65b71142c781b7' }}
          GITHUB_SHA: ${{ github.sha }}
          ISTAROTH_EMBEDDING_MODEL: BAAI/bge-small-zh-v1.5
      - name: Compute short SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
        working-directory: GamesMcp
      - uses: actions/upload-artifact@v4
        with:
          name: starrail-istaroth-checkpoint-${{ steps.vars.outputs.sha_short }}
          path: |
            starrail-corpus/metadata/starrail/*.json
            starrail-corpus/manifest/*.json
            starrail-checkpoint/
