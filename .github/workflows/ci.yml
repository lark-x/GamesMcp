name: ci

on:
  push:
  pull_request:

jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm build

  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: gip
          POSTGRES_PASSWORD: gip
          POSTGRES_DB: gip
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gip -d gip"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Workspace packages expose their compiled dist entrypoints.  Build
      # them before the database integration script imports repository code.
      - run: pnpm build
      - run: pnpm test:db
        env:
          GIP_DB_TEST_URL: postgres://gip:gip@127.0.0.1:5432/gip

  candidate-flow:
    # Sprint 15/30: full candidate -> build -> preview -> promote -> materialize ->
    # failure-path -> rollback flow against a disposable database.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: gip
          POSTGRES_PASSWORD: gip
          POSTGRES_DB: gip
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gip -d gip"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test:candidate-flow:local
        env:
          DATABASE_URL: postgres://gip:gip@127.0.0.1:5432/gip

  story-gates:
    # Sprint 30: story search regression + MCP golden shape + QA golden shape gates.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Real-upstream corpus regression (uses memory adapter fallback when no DB is
      # provisioned; the recorded fallbackReason keeps the run honest).
      - run: pnpm eval:search-regression
      # Golden datasets must exist, be parseable and respect minimum sizes.
      - run: |
          node --import tsx -e "
            const fs = require('node:fs');
            const qa = JSON.parse(fs.readFileSync('data/fixtures/qa-golden.json', 'utf8'));
            const mcp = JSON.parse(fs.readFileSync('data/evaluation/genshin/mcp-golden.json', 'utf8'));
            const qaCount = Array.isArray(qa) ? qa.length : (qa.cases?.length ?? 0);
            const mcpCount = Array.isArray(mcp) ? mcp.length : (mcp.cases?.length ?? 0);
            if (qaCount + mcpCount < 490) {
              throw new Error('golden dataset too small: ' + (qaCount + mcpCount));
            }
            console.log('golden cases:', qaCount, '+', mcpCount);
          "

  archive-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: npx playwright install chromium
      - run: pnpm playwright test apps/web/tests/archive.spec.ts

  docker-smoke:
    runs-on: ubuntu-latest
    env:
      DATA_DIR: /tmp/gamesmcp-data
      GAMESMCP_VERSION: test
      ISTAROTH_IMAGE: ghcr.io/example/istaroth:test
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Validate Compose Configs
        run: |
          mkdir -p /tmp/gamesmcp-data
          cp .env.example .env
          docker compose config
          docker compose -f docker-compose.prod.yml config
      - name: Build API Runtime Target
        run: docker build --target api-runtime -f docker/Dockerfile .
      - name: Build Worker Runtime Target
        run: docker build --target worker-runtime -f docker/Dockerfile .
      - name: Build Web Runtime Target
        run: docker build --target web-runtime -f docker/Dockerfile .

  docker-release:
    needs:
      - verify
      - database
      - candidate-flow
      - story-gates
      - archive-e2e
      - docker-smoke
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine Version Tags
        id: meta
        run: |
          SHA="${GITHUB_SHA::7}"
          TAGS_API="ghcr.io/${{ github.repository_owner }}/gamesmcp-api:${GITHUB_SHA},ghcr.io/${{ github.repository_owner }}/gamesmcp-api:${SHA},ghcr.io/${{ github.repository_owner }}/gamesmcp-api:main,ghcr.io/${{ github.repository_owner }}/gamesmcp-api:latest"
          TAGS_WORKER="ghcr.io/${{ github.repository_owner }}/gamesmcp-worker:${GITHUB_SHA},ghcr.io/${{ github.repository_owner }}/gamesmcp-worker:${SHA},ghcr.io/${{ github.repository_owner }}/gamesmcp-worker:main,ghcr.io/${{ github.repository_owner }}/gamesmcp-worker:latest"
          TAGS_WEB="ghcr.io/${{ github.repository_owner }}/gamesmcp-web:${GITHUB_SHA},ghcr.io/${{ github.repository_owner }}/gamesmcp-web:${SHA},ghcr.io/${{ github.repository_owner }}/gamesmcp-web:main,ghcr.io/${{ github.repository_owner }}/gamesmcp-web:latest"
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            RELEASE_TAG="${GITHUB_REF_NAME}"
            TAGS_API="${TAGS_API},ghcr.io/${{ github.repository_owner }}/gamesmcp-api:${RELEASE_TAG}"
            TAGS_WORKER="${TAGS_WORKER},ghcr.io/${{ github.repository_owner }}/gamesmcp-worker:${RELEASE_TAG}"
            TAGS_WEB="${TAGS_WEB},ghcr.io/${{ github.repository_owner }}/gamesmcp-web:${RELEASE_TAG}"
          fi
          echo "tags_api=${TAGS_API}" >> $GITHUB_OUTPUT
          echo "tags_worker=${TAGS_WORKER}" >> $GITHUB_OUTPUT
          echo "tags_web=${TAGS_WEB}" >> $GITHUB_OUTPUT

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: api-runtime
          push: true
          tags: ${{ steps.meta.outputs.tags_api }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build and push Worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: worker-runtime
          push: true
          tags: ${{ steps.meta.outputs.tags_worker }}
          cache-from: type=gha,scope=worker
          cache-to: type=gha,mode=max,scope=worker

      - name: Build and push Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: web-runtime
          push: true
          tags: ${{ steps.meta.outputs.tags_web }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
